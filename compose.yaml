services:
  app:
    build: .
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:5173}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-5173}:5173"
    volumes:
      - dance_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 4s
      retries: 4
volumes:
  dance_data:
